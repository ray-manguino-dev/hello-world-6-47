<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World 6.47</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Hello World 6.47 — Warm, Welcoming Styles */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #fff8f0 0%, #F5E6D3 50%, #ffe8d6 100%);
            font-family: 'Nunito', 'Segoe UI', system-ui, sans-serif;
            color: #2D3436;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: fadeIn 400ms ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        main {
            background: #FDFAF5;
            border-radius: 24px;
            padding: clamp(24px, 5vw, 48px) clamp(24px, 5vw, 56px);
            max-width: 480px;
            width: 90%;
            box-shadow:
                0 4px 24px rgba(74, 144, 164, 0.12),
                0 1px 3px rgba(74, 144, 164, 0.08);
            text-align: center;
        }

        h1 {
            font-family: 'Quicksand', system-ui, sans-serif;
            font-size: 2.2rem;
            font-weight: 700;
            color: #4A90A4;
            margin: 0 0 8px 0;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 1rem;
            color: #7a5a3a;
            margin: 0 0 36px 0;
        }

        #name-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 28px;
        }

        label {
            font-size: 1rem;
            font-weight: 500;
            color: #2D3436;
            display: block;
            text-align: left;
        }

        #name-input {
            padding: 14px 18px;
            font-size: 1.1rem;
            font-family: inherit;
            border: 2px solid #F5E6D3;
            border-radius: 12px;
            background: #FDFAF5;
            color: #2D3436;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
            width: 100%;
        }

        #name-input::placeholder {
            color: #b0b0b0;
        }

        #name-input:focus {
            border-color: #E8A87C;
            box-shadow: 0 0 0 4px rgba(232, 168, 124, 0.2);
        }

        #name-input.error {
            border-color: #E74C3C;
            animation: shake 0.4s ease-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-6px); }
            40% { transform: translateX(6px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }

        .error-message {
            color: #E74C3C;
            font-size: 0.875rem;
            text-align: left;
            margin-top: -8px;
            display: none;
        }

        .error-message.visible {
            display: block;
        }

        button[type="submit"] {
            padding: 14px 32px;
            font-size: 1.1rem;
            font-weight: 600;
            font-family: inherit;
            color: #fff;
            background: linear-gradient(135deg, #E8A87C 0%, #d4956a 100%);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 14px rgba(232, 168, 124, 0.35);
        }

        button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(232, 168, 124, 0.45);
        }

        button[type="submit"]:active {
            transform: translateY(0);
            box-shadow: 0 2px 8px rgba(232, 168, 124, 0.3);
        }

        #welcome-message {
            font-family: 'Quicksand', system-ui, sans-serif;
            font-size: 1.3rem;
            font-weight: 500;
            color: #2D3436;
            background: linear-gradient(135deg, #fff3e6 0%, #ffe0cc 100%);
            padding: 20px 24px;
            border-radius: 16px;
            min-height: 72px;
            display: none;
            align-items: center;
            justify-content: center;
            line-height: 1.5;
            border: 1px solid #F5E6D3;
        }

        #welcome-message.visible {
            display: flex;
            animation: slideUp 500ms ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .welcome-name {
            color: #E8A87C;
            font-weight: 700;
        }

        #reset-link {
            display: none;
            margin-top: 16px;
            font-size: 0.875rem;
            color: #7a5a3a;
            text-decoration: underline;
            cursor: pointer;
            background: none;
            border: none;
            font-family: inherit;
        }

        #reset-link:hover {
            color: #E8A87C;
        }

        #reset-link.visible {
            display: block;
        }
    </style>
</head>
<body>
    <main>
        <h1>Welcome to Hello World</h1>
        <p class="subtitle">Enter your name below and we'll welcome you back!</p>

        <form id="name-form">
            <label for="name-input">Enter your name</label>
            <input
                type="text"
                id="name-input"
                placeholder="Your name..."
                autocomplete="off"
                required
            >
            <span id="error-message" class="error-message">Please enter your name</span>
            <button type="submit">Get Started</button>
        </form>

        <div id="welcome-message">
            <span id="welcome-text"></span>
        </div>
        <button id="reset-link" type="button">Start over</button>
    </main>

    <script>
        // Hello World 6.47 — Form Handler

        document.addEventListener('DOMContentLoaded', function () {
            const form = document.getElementById('name-form');
            const nameInput = document.getElementById('name-input');
            const welcomeMessage = document.getElementById('welcome-message');
            const welcomeText = document.getElementById('welcome-text');
            const errorMessage = document.getElementById('error-message');
            const resetLink = document.getElementById('reset-link');

            // Escape HTML to prevent XSS
            function escapeHtml(str) {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            // Get friendly date string (e.g. "Happy Tuesday")
            function getFriendlyDate() {
                const now = new Date();
                const formatter = new Intl.DateTimeFormat('en-US', {
                    weekday: 'long'
                });
                const dayName = formatter.format(now);
                return 'Happy ' + dayName + '!';
            }

            // Truncate name at 50 characters
            function truncateName(name) {
                if (name.length > 50) {
                    return name.substring(0, 50) + '\u2026'; // ellipsis
                }
                return name;
            }

            form.addEventListener('submit', function (e) {
                e.preventDefault();

                const rawName = nameInput.value.trim();

                // Empty name — show inline error, shake input
                if (!rawName) {
                    nameInput.classList.add('error');
                    errorMessage.classList.add('visible');
                    nameInput.focus();
                    return;
                }

                // Clear any previous error
                nameInput.classList.remove('error');
                errorMessage.classList.remove('visible');

                // Truncate long names
                const displayName = truncateName(rawName);
                const safeName = escapeHtml(displayName);

                // Build welcome message
                const friendlyDate = getFriendlyDate();
                welcomeText.innerHTML =
                    '<span style="font-size:1.5em;">\uD83D\uDC4B</span> Welcome back, <span class="welcome-name">' + safeName + '</span>!<br>' +
                    '<span style="font-size:0.85em; color:#7a5a3a;">' + friendlyDate + '</span>';

                // Show welcome, hide form
                form.style.display = 'none';
                welcomeMessage.classList.add('visible');
                resetLink.classList.add('visible');
            });

            // Remove error styling on input
            nameInput.addEventListener('input', function () {
                nameInput.classList.remove('error');
                errorMessage.classList.remove('visible');
            });

            // Reset — go back to form
            resetLink.addEventListener('click', function () {
                nameInput.value = '';
                welcomeMessage.classList.remove('visible');
                resetLink.classList.remove('visible');
                form.style.display = 'flex';
                nameInput.focus();
            });
        });
    </script>
</body>
</html>
